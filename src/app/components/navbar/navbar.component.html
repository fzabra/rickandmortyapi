<mat-toolbar class="toolbar">
  <a class="brand" routerLink="/">
    <img src="assets/images/Rick_and_Morty.svg" alt="Rick and Morty" />
    <span>{{ 'app.title' | t }}</span>
  </a>

  <nav class="menu">
    <a mat-stroked-button routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      {{ 'nav.home' | t }}
    </a>

    <a mat-stroked-button routerLink="/favorites" routerLinkActive="active">
      <mat-icon>favorite</mat-icon>
      {{ 'nav.favorites' | t }}
      <span class="counter">{{ favoritesCount$ | async }}</span>
    </a>
  </nav>

  <div class="lang-switch">
    <button mat-button [class.selected]="currentLanguage === 'pt-BR'" (click)="setLanguage('pt-BR')">PT</button>
    <button mat-button [class.selected]="currentLanguage === 'en-US'" (click)="setLanguage('en-US')">EN</button>
  </div>
</mat-toolbar>
